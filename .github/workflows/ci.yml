name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_replace_me
      CLERK_SECRET_KEY: sk_test_replace_me
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/developer_event_dashboard
      MIGRATION_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/developer_event_dashboard
      CRON_SECRET: ci-only-placeholder-not-for-deployment
      SUPPORT_URL: ""
      INGESTION_ENABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build production app
        run: npm run build
